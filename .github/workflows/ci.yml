name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # O build do Vite falha em import quebrado, JSX inválido e CSS Module
      # ausente — é o que pega regressão de módulo novo antes do merge.
      - run: npm run build
